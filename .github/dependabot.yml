version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
    # PR titles must be Conventional Commits (pr-title-lint); `ci:` also keeps
    # these out of the release notes.
    commit-message:
      prefix: "ci"
