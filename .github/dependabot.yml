version: 2

updates:
  # Keeps the SHA-pinned actions current. Dependabot bumps a `<sha> # vX.Y.Z`
  # pin to the new release's SHA and rewrites the tag comment to match. A
  # `<sha> # main` pin (meridianlabs-ai/actions, until a release tag has the
  # shared Python actions) moves to that branch's head, with no cooldown.
  - package-ecosystem: github-actions
    # / covers the workflows; the local composite actions pin actions too.
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    # Wait a week after a release before proposing it, so a compromised
    # release has time to be caught. Security updates skip the cooldown.
    cooldown:
      default-days: 7
    # One PR per week for all actions, not one per action.
    groups:
      github-actions:
        patterns:
          - "*"
    # pr-title-lint requires a Conventional Commits title; `ci` keeps these
    # out of the release notes.
    commit-message:
      prefix: ci
    assignees:
      - epatey
  # Bumps uv.lock. The cooldown matches `exclude-newer` in pyproject.toml, and
  # its exclude list matches the "6 hours" entries in `exclude-newer-package`
  # there (a dated emergency entry is locked by hand): Dependabot's
  # cooldown counts whole days, so those packages' 6-hour cooldown is left to
  # uv. They get their own group, so a broken update elsewhere can't hold them
  # up. It comes first because a package that matches both groups goes to the
  # first. inspect-ai comes from inspect_ai main. CI moves it to main's latest
  # commit on every run, but Dependabot resolves against the commit in uv.lock,
  # so ignoring inspect-ai breaks updates that need a newer one.
  - package-ecosystem: uv
    versioning-strategy: lockfile-only
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
      exclude:
        - "anthropic"
        - "google-genai"
        - "inspect-ai"
        - "inspect-swe"
        - "openai"
    groups:
      six-hour-cooldown:
        patterns:
          - "anthropic"
          - "google-genai"
          - "inspect-ai"
          - "inspect-swe"
          - "openai"
      python-packages:
        patterns:
          - "*"
    # `build` keeps these out of the release notes.
    commit-message:
      prefix: build
    assignees:
      - epatey
  # Bumps the release build toolchain pinned with hashes in
  # scripts/build-dist/requirements.txt.
  - package-ecosystem: uv
    directory: /scripts/build-dist
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      build-toolchain:
        patterns:
          - "*"
    commit-message:
      prefix: ci
    assignees:
      - epatey
