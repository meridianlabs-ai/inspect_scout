version: 2

updates:
  # Keeps the SHA-pinned actions current. Dependabot bumps a `<sha> # vX.Y.Z`
  # pin to the new release's SHA and rewrites the tag comment to match.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait a week after a release before proposing it, so a compromised
    # release has time to be caught. Security updates skip the cooldown.
    cooldown:
      default-days: 7
    # One PR per week for all actions, not one per action.
    groups:
      github-actions:
        patterns:
          - "*"
    # pr-title-lint requires a Conventional Commits title; `ci` keeps these
    # out of the release notes.
    commit-message:
      prefix: ci
    assignees:
      - epatey
  # Bumps uv.lock. The cooldown matches `exclude-newer` in pyproject.toml, and
  # its exclude list matches `exclude-newer-package` there: Dependabot's
  # cooldown counts whole days, so those packages' 6-hour cooldown is left to
  # uv. They get their own group, listed first because a package in both
  # groups goes to the first match, so a broken update elsewhere can't hold
  # them up.
  - package-ecosystem: uv
    versioning-strategy: lockfile-only
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
      exclude:
        - "anthropic"
        - "certifi"
        - "google-genai"
        - "inspect-ai"
        - "inspect-swe"
        - "openai"
    groups:
      six-hour-cooldown:
        patterns:
          - "anthropic"
          - "certifi"
          - "google-genai"
          - "inspect-ai"
          - "inspect-swe"
          - "openai"
      python-packages:
        patterns:
          - "*"
    # `build` keeps these out of the release notes.
    commit-message:
      prefix: build
    assignees:
      - epatey
