name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - "release/**"
  workflow_dispatch:

# Supersede in-flight PR runs when the branch is pushed again. Every other
# trigger — pushes to main and manual dispatch — keys on run_id, giving each
# run a group of one. A shared group would let a batch of merges leave an
# intermediate main commit unbuilt: only one run may pend per group, and a
# third arrival cancels the pending second.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job here only reads the repo. State that rather than inheriting the
# repo default.
permissions:
  contents: read

env:
  # Must meet pyproject.toml's required-version.
  UV_VERSION: 0.13.5

# Each job carries timeout-minutes well above its observed duration on main
# (slowest: py-test at ~5m). Without one, a hung step holds a runner to the
# 6-hour default while the PR sits "in progress".
jobs:
  py-ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        # rationale: test the supported floor and the latest release
        python-version: &python-versions ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The ruff version uv.lock pins, not the newest release.
      - name: Lint with Ruff
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version-file: uv.lock
      - name: Format with Ruff
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version-file: uv.lock
          args: "format --check"

  py-mypy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: *python-versions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python-version }}
      # --locked fails on a uv.lock that is out of date with pyproject.toml
      # instead of re-resolving it.
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Run mypy
        run: uv run --no-sync mypy src examples tests
      - name: Minimize uv cache
        if: ${{ !cancelled() }}
        run: uv cache prune --ci

  config-carveouts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # stdlib-only gate; the runner's default python3 (>= 3.11, has tomllib)
      # is all it needs — no venv, no installs
      - name: Check config carve-out ledger
        run: python3 scripts/check_config_carveouts.py

  py-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: *python-versions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Run tests
        run: uv run --no-sync pytest
      - name: Minimize uv cache
        if: ${{ !cancelled() }}
        run: uv cache prune --ci

  py-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: *python-versions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python-version }}
      # The project's locked dependencies and the dist extra, not the project
      # itself: the step after the build installs the wheel.
      - name: Install build dependencies
        run: uv sync --locked --extra dist --no-install-project
      - name: Build package
        run: .venv/bin/python -m build
      - name: Verify package
        run: |
          uv pip install --no-deps dist/*.whl
          # -I so the import resolves to the installed wheel, not a checkout-root module.
          .venv/bin/python -I -c "import inspect_scout; print('Package imported successfully')"
      - name: Minimize uv cache
        if: ${{ !cancelled() }}
        run: uv cache prune --ci

  check-schema-and-types:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.11"
      - name: Install Python dependencies
        run: uv sync --locked

      # This job checks that the committed schema/type artifacts are in sync
      # with the Python source, a regeneration-hygiene check, not a
      # shipped-compatibility gate. The committed artifacts are generated
      # against inspect_ai main, so the Python → json check runs only while
      # uv.lock tracks inspect_ai main. The release PR locks the released
      # inspect_ai, which would show false drift for fields not yet released;
      # so does main between the release and the merge of the PR that
      # restores tracking (release-pin-deps.yml).
      #
      # The release PR must be tested against the released inspect_ai. Each
      # Release Please update resets its branch to main's uv.lock, so it fails
      # here until release-pin-deps.yml pushes the pinned lock.
      - name: Check whether uv.lock tracks inspect_ai main
        id: lock
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          python3 -I - <<'PY' >> "$GITHUB_OUTPUT"
          import os, sys, tomllib
          lock = tomllib.load(open("uv.lock", "rb"))
          (inspect_ai,) = [p for p in lock["package"] if p["name"] == "inspect-ai"]
          tracks_main = "git" in inspect_ai["source"]
          if tracks_main and os.environ["HEAD_REF"] == "release-please--branches--main":
              print("::error::The release PR's uv.lock still tracks inspect_ai main. "
                    "Wait for release-pin-deps.yml to lock the released inspect_ai.",
                    file=sys.stderr)
              sys.exit(1)
          print(f"tracks-main={tracks_main}")
          PY

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: src/inspect_scout/_view/ts-mono/package.json
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: src/inspect_scout/_view/ts-mono/pnpm-lock.yaml
      - name: Install JS dependencies
        working-directory: src/inspect_scout/_view/ts-mono
        run: pnpm install --frozen-lockfile

      # The pipeline is Python → openapi.json → generated.ts. The two arrows
      # are checked independently: json → ts must match exactly, while
      # Python → json tolerates docstring-only ("description") drift so that
      # doc changes don't require regenerating checked-in artifacts. As a
      # result, description text in the committed artifacts can lag the Python
      # docstrings until the next structural change forces a regeneration.

      - name: Check generated types are in sync with checked-in schema
        working-directory: src/inspect_scout/_view/ts-mono
        run: |
          pnpm --filter scout types:generate
          if ! git diff --exit-code -- apps/scout/src/types/generated.ts
          then
            echo "❌ generated.ts is out of sync with the committed openapi.json."
            echo "Regenerate both artifacts and commit them:"
            echo "  .venv/bin/python scripts/export_openapi_schema.py"
            exit 1
          fi

      - name: Regenerate schema from Python source
        if: steps.lock.outputs.tracks-main == 'True'
        run: uv run --no-sync python scripts/export_openapi_schema.py

      - name: Check schema is up to date (docstring-only drift tolerated)
        if: steps.lock.outputs.tracks-main == 'True'
        run: uv run --no-sync python .github/scripts/check_openapi_drift.py

      - name: Ensure regeneration produced no other changes
        run: |
          if git status --porcelain \
              | grep -vE 'src/inspect_scout/_view/(openapi\.json|ts-mono)$' \
              | grep -q . \
            || git -C src/inspect_scout/_view/ts-mono status --porcelain \
              | grep -v 'apps/scout/src/types/generated\.ts$' \
              | grep -q .
          then
            echo "❌ Unexpected changes after regeneration:"
            git status
            git diff -- . ':!src/inspect_scout/_view/openapi.json'
            git -C src/inspect_scout/_view/ts-mono status
            git -C src/inspect_scout/_view/ts-mono diff -- . ':!apps/scout/src/types/generated.ts'
            exit 1
          fi

  submodule-on-main:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify submodule commit is on ts-mono main
        run: |
          SUBMODULE_SHA=$(git ls-tree HEAD src/inspect_scout/_view/ts-mono | awk '{print $3}')
          echo "Submodule points to: $SUBMODULE_SHA"

          git fetch https://github.com/meridianlabs-ai/ts-mono.git main
          MAIN_SHA=$(git rev-parse FETCH_HEAD)
          echo "ts-mono main is at: $MAIN_SHA"

          if git merge-base --is-ancestor "$SUBMODULE_SHA" "$MAIN_SHA"; then
            echo "✓ Submodule commit is on ts-mono main"
          else
            echo "✗ Submodule commit $SUBMODULE_SHA is not on ts-mono main."
            echo "  Merge the submodule PR first, then update the pointer (see docs/submodule-guide.md step 6)."
            exit 1
          fi

  # Runs the viewer test suite in the inspect_scout embedding. This includes the
  # fixture-driven timeline tests (packages/inspect-components), which consume
  # tests/transcript/nodes/fixtures/events/ from this repo and are skipped in
  # ts-mono's own standalone CI — so without this job, nothing exercises them
  # against this repo's corpus. Mirrors inspect_ai's viewer-tests job.
  viewer-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: src/inspect_scout/_view/ts-mono/package.json

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: src/inspect_scout/_view/ts-mono/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: src/inspect_scout/_view/ts-mono
        run: pnpm install --frozen-lockfile

      - name: Run inspect-components tests
        working-directory: src/inspect_scout/_view/ts-mono
        # The variable asserts that this repo's corpus is present, so the suite
        # fails rather than skipping if it can no longer find the fixtures.
        env:
          TSMONO_REQUIRE_FIXTURES: "1"
        run: pnpm --filter @tsmono/inspect-components test

  js-dist-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: src/inspect_scout/_view/ts-mono/package.json

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: src/inspect_scout/_view/ts-mono/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: src/inspect_scout/_view/ts-mono
        run: pnpm install --frozen-lockfile

      # Same gate the npm publish workflow runs (lint, typecheck, format). The
      # build below is plain `vite build` and does not typecheck, so without
      # this a gitlink bump to a non-compiling ts-mono commit passes CI here
      # and only fails at release time.
      - name: Check
        working-directory: src/inspect_scout/_view/ts-mono
        run: pnpm check

      - name: Build
        working-directory: src/inspect_scout/_view/ts-mono
        run: pnpm build

      - name: Check dist is up-to-date
        run: |
          if ! git diff --exit-code src/inspect_scout/_view/dist
          then
            echo "❌ dist/ is out of sync with the frontend source!"
            echo ""
            echo "The build output has changed. Run:"
            echo "  cd src/inspect_scout/_view/ts-mono"
            echo "  pnpm build"
            echo ""
            echo "Then commit the updated dist/ directory."
            exit 1
          fi
