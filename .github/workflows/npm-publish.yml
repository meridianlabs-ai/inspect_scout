name: Publish React Viewer Lib

on:
  # Auto-publish when Release Please cuts a GitHub Release (App token triggers
  # this). Replaces the old tag-push trigger — release-please owns tags now, and
  # triggering on the release avoids a double-fire from tag creation.
  release:
    types: [published]
  # Manual break-glass path (defaults to dry-run). To publish a release,
  # dispatch on its version tag: the publish job checks the version against it.
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Run in dry-run mode (don't actually publish)"
        required: false
        type: boolean
        default: true
      prerelease:
        description: "Publish as pre-release (beta)"
        required: false
        type: boolean
        default: false

permissions: {}

jobs:
  # Post the "awaiting approval" Slack ping — un-gated, in this same run, so it
  # deep-links to the run whose publish job is paused on the npm environment.
  notify-approval:
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-latest
    steps:
      - uses: meridianlabs-ai/actions/slack-approval-ping@91fe6b994ae387f2d1002c8aee193e198bda33a7 # v1
        with:
          webhook: ${{ secrets.SLACK_APPROVALS_WEBHOOK_URL }}
          approvers: "jjallaire dragonstyle epatey"
          message: ":package: *${{ github.repository }}* ${{ github.event.release.tag_name }} — npm viewer-lib publish is *awaiting approval*."
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  # Installs, checks and packs without id-token, so the workspace's
  # dependencies never run in a job that can publish; the publish job only
  # uploads the packed tarball.
  build:
    name: Build npm package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/inspect_scout/_view/ts-mono/apps/scout
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: src/inspect_scout/_view/ts-mono/package.json

      # No pnpm cache: the published package must be built from the reviewed
      # lockfile, not from a pnpm store another workflow saved to the cache.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.x"
          package-manager-cache: false

      # The publish job's npm, so a dry-run applies the same publish checks.
      - name: Upgrade npm
        run: |
          npm install --prefix "$RUNNER_TEMP/npm-upgrade" --no-audit --no-fund --ignore-scripts npm@11.21.0
          echo "$RUNNER_TEMP/npm-upgrade/node_modules/.bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/npm-upgrade/node_modules/.bin/npm" --version

      - name: Install dependencies
        working-directory: src/inspect_scout/_view/ts-mono
        run: pnpm install --frozen-lockfile

      - name: Prepare package for publishing
        run: |
          npm pkg set name="@meridianlabs/inspect-scout-viewer"
          npm pkg delete private
          # Version tags live on the parent repo; the submodule has none.
          VERSION=$(git -C ${{ github.workspace }} describe --tags --abbrev=0 --match='[0-9]*.[0-9]*.[0-9]*')
          npm version "$VERSION" --no-git-tag-version

      - name: Bump to prerelease version
        if: ${{ inputs.prerelease }}
        run: |
          TIMESTAMP=$(date +%s)
          npm version patch --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          npm version "${NEW_VERSION}-beta.${TIMESTAMP}" --no-git-tag-version

      - name: Run quality checks
        working-directory: src/inspect_scout/_view/ts-mono
        run: pnpm check

      # The publish job uploads a tarball, which runs no lifecycle scripts,
      # so the package's prepublishOnly (the library build) runs here instead.
      - name: Build library
        run: pnpm run prepublishOnly

      - name: Pack
        run: |
          mkdir -p "$RUNNER_TEMP/npm-package"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/npm-package"

      - name: Publish to NPM (dry-run)
        if: ${{ inputs.dry-run }}
        run: npm publish --dry-run --ignore-scripts --access public "$RUNNER_TEMP"/npm-package/*.tgz ${{ inputs.prerelease && '--tag beta' || '' }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm-package/
          if-no-files-found: error
          # a re-run of this job replaces the earlier attempt's artifact
          overwrite: true

  publish:
    name: Publish to NPM
    needs: build
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      # No checkout: nothing from the repository is installed or run in the
      # job that holds the publishing id-token.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.x"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Upgrade npm (for Trusted Publishing)
        run: |
          # Install via prefix to avoid npm self-upgrade rebuild bug on Node 22.
          # An exact version (Trusted Publishing needs >= 11.5.1) without install
          # scripts, since this job holds the publishing id-token.
          npm install --prefix "$RUNNER_TEMP/npm-upgrade" --no-audit --no-fund --ignore-scripts npm@11.21.0
          echo "$RUNNER_TEMP/npm-upgrade/node_modules/.bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/npm-upgrade/node_modules/.bin/npm" --version

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: npm-package/

      # The build job chose the name and version; publish only the release
      # being run (or, for a prerelease, a beta version).
      - name: Check the package
        id: package
        env:
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          shopt -s nullglob
          # Absolute: npm reads a bare `dir/file.tgz` as a GitHub shorthand.
          TARBALLS=("$PWD"/npm-package/*.tgz)
          [ ${#TARBALLS[@]} -eq 1 ] || fail "Expected one package tarball, found ${#TARBALLS[@]}"
          MANIFEST=$(tar -xOzf "${TARBALLS[0]}" package/package.json)
          NAME=$(jq -r .name <<< "$MANIFEST")
          VERSION=$(jq -r .version <<< "$MANIFEST")
          [ "$NAME" = "@meridianlabs/inspect-scout-viewer" ] || fail "Unexpected package name '$NAME'"
          if [ "$PRERELEASE" = "true" ]; then
            [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]] ||
              fail "Prerelease version '$VERSION' is not X.Y.Z-beta.N"
          else
            [ "$VERSION" = "$TAG" ] || fail "Package version '$VERSION' does not match release tag '$TAG'"
          fi
          {
            echo "tarball=${TARBALLS[0]}"
            echo "name=$NAME"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"

      # npm never accepts a version twice, so a retried release skips the
      # publish once the version exists.
      - name: Check npm for this version
        id: npm-version
        if: ${{ !inputs.prerelease }}
        env:
          NAME: ${{ steps.package.outputs.name }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          if [ -n "$(npm view "$NAME@$VERSION" version 2>/dev/null)" ]; then
            echo "::notice::$NAME@$VERSION is already on npm; not publishing it again"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to NPM
        if: ${{ steps.npm-version.outputs.published != 'true' }}
        env:
          TARBALL: ${{ steps.package.outputs.tarball }}
        run: npm publish "$TARBALL" --ignore-scripts --access public ${{ inputs.prerelease && '--tag beta' || '' }}
