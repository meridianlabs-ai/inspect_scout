name: PR Title Lint

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  lint:
    permissions:
      pull-requests: read # read the PR title
    # A commit on main rather than v1: v1's reusables call their own actions by tag.
    uses: meridianlabs-ai/actions/.github/workflows/pr-title-lint.yml@f4ae19412da5597fc283e3ef62db1a67384ae609 # commit on main
    with:
      # Read the type list from the same commit (tests/test_workflow_pins.py
      # checks they match).
      types-ref: f4ae19412da5597fc283e3ef62db1a67384ae609
