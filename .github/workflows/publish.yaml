name: Publish Package

on:
  # Auto-publish when Release Please cuts a GitHub Release (App token triggers
  # this). Runs in-repo, so the PyPI trusted-publisher config (workflow
  # publish.yaml, environment pypi) is unchanged.
  release:
    types: [published]
  # Manual break-glass path: run on the release tag (select it under "Use
  # workflow from"). Without "yes", it builds and verifies but does not publish.
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "yes" to confirm PyPI publication'
        required: true
        type: string

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Post the "awaiting approval" Slack ping — un-gated, in this same run, so it
  # deep-links to the run whose publish job is paused on the pypi environment.
  # After the verify job, so it is sent only for a checked dist that the
  # publish job will wait to upload.
  notify-approval:
    needs: verify
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: meridianlabs-ai/actions/slack-approval-ping@91fe6b994ae387f2d1002c8aee193e198bda33a7 # v1
        with:
          webhook: ${{ secrets.SLACK_APPROVALS_WEBHOOK_URL }}
          approvers: "jjallaire dragonstyle epatey"
          message: ":rocket: *${{ github.repository }}* ${{ github.event.release.tag_name }} — PyPI publish is *awaiting approval*."
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  # Checks the tag in a job with no publishing credential, before the build.
  check-tag:
    name: Check release tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # all tags, and main for the ancestry check
          fetch-depth: 0
          persist-credentials: false

      - name: Check release tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [ "$GITHUB_REF_TYPE" = "tag" ] ||
            fail "Publish must run on a release tag, not $GITHUB_REF_TYPE '$GITHUB_REF_NAME'"
          [[ "$GITHUB_REF_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] ||
            fail "Tag '$GITHUB_REF_NAME' is not a release version (X.Y.Z)"
          if [ "$EVENT_NAME" = "release" ]; then
            [ "$RELEASE_TAG" = "$GITHUB_REF_NAME" ] ||
              fail "Release tag '$RELEASE_TAG' does not match ref '$GITHUB_REF_NAME'"
            [ "$PRERELEASE" != "true" ] ||
              fail "Release $GITHUB_REF_NAME is marked pre-release; not publishing to PyPI"
            git merge-base --is-ancestor HEAD origin/main ||
              fail "Tag $GITHUB_REF_NAME is not on main; to publish it anyway, dispatch this workflow on the tag"
          fi

  # The build runs in the shared workflow, in a job with no publishing
  # credential. It uses the hashed scripts/build-dist/requirements.txt, which
  # Dependabot updates. To update the file by hand, run in scripts/build-dist:
  #   uv pip compile --no-config --generate-hashes --python-version 3.11 \
  #     --python-platform x86_64-unknown-linux-gnu --exclude-newer "7 days" \
  #     --only-binary :all: --upgrade requirements.in -o requirements.txt
  build:
    needs: check-tag
    permissions:
      contents: read
    uses: meridianlabs-ai/actions/.github/workflows/build-python-dist.yml@b6f97e6b72216233d805ce570ceb7fa2071f8a93 # main
    with:
      python-version: "3.11"
      # the built viewer (src/inspect_scout/_view/dist) is in Git LFS
      lfs: true

  # Checks the built distributions in a job with no publishing credential,
  # before approval is requested.
  verify:
    name: Verify distributions
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/verify_dist.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: dist/

      - name: Verify distributions
        run: python3 -I scripts/verify_dist.py "$GITHUB_REF_NAME"

  publish:
    name: Publish to PyPI
    needs: [build, verify]
    if: ${{ github.event_name == 'release' || inputs.confirm == 'yes' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # trusted publishing
    environment:
      name: pypi
      url: https://pypi.org/p/inspect-scout
    steps:
      # Only the stdlib-only check script; nothing is installed or built in
      # the job that holds the publish token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/verify_dist.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: dist/

      # The verify job did this check already. Do it again here on the exact
      # files that are uploaded.
      - name: Verify distributions
        run: python3 -I scripts/verify_dist.py "$GITHUB_REF_NAME"

      # A Docker action, so it stays a step of this job: inside a composite
      # action its image resolves against the calling repository and fails.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
