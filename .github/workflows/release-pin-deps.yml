name: Pin inspect_ai for release

# Development and CI track inspect_ai main: pyproject.toml's [tool.uv.sources]
# points inspect-ai at its main branch, and every CI install moves it to main's
# latest commit (.github/actions/uv-sync). A published scout requires a
# released inspect_ai through the `inspect-ai>=` floor in [project] (PyPI
# rejects direct-reference deps, and only uv reads [tool.uv.sources]). On the
# release PR, CI ignores the git source and installs the newest inspect-ai
# release that clears its cooldown. This workflow raises the floor to that
# release, so the declared minimum is the version the release was tested
# against. Main keeps the git source throughout.
#
# Runs on release-PR events and on a schedule: publishing a new inspect_ai to
# PyPI produces no event in this repo, so the schedule is what turns "inspect
# shipped the fix we need" into "the release PR re-pins and goes green" without
# a human nudge. If scout needs an unreleased inspect_ai, the release PR's
# checks fail, which is the signal to cut an inspect_ai release first.
#
# `uv lock` may build sdists to read their metadata, which runs dependency
# code. So the floor job holds only a read-only token that checkout doesn't
# persist, and restores no cache. The push job holds the App token and installs
# and runs nothing from the repo: it copies pyproject.toml from the floor job's
# artifact and commits it. Code that runs during the lock can still change that
# file; it reaches main only through the release PR a maintainer merges.

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 */2 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-pin-deps
  cancel-in-progress: false

env:
  UV_VERSION: 0.13.5
  RELEASE_BRANCH: release-please--branches--main

jobs:
  floor:
    # PR events: only the Release Please release PR, from this repository.
    # Schedule/dispatch: always start; the first step exits quietly when no
    # release PR is open.
    if: >-
      github.repository == 'meridianlabs-ai/inspect_scout' &&
      (github.event_name != 'pull_request' ||
       (github.head_ref == 'release-please--branches--main' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    outputs:
      sha: ${{ steps.floor.outputs.sha }}
      changed: ${{ steps.floor.outputs.changed }}
    steps:
      - name: Check an open release PR exists (scheduled runs)
        id: relpr
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          n=$(gh pr list --repo "$GITHUB_REPOSITORY" \
                --head "$RELEASE_BRANCH" --state open \
                --json number --jq 'length')
          if [ "$n" -gt 0 ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "No open release PR; nothing to pin."
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.relpr.outputs.found == 'true'
        with:
          ref: ${{ env.RELEASE_BRANCH }}
          persist-credentials: false

      - name: Install uv
        if: steps.relpr.outputs.found == 'true'
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      # -I keeps the checkout off sys.path, so a module at the release branch's
      # root can't shadow the stdlib.
      - name: Raise the inspect-ai floor
        id: floor
        if: steps.relpr.outputs.found == 'true'
        run: |
          python3 -I .github/scripts/inspect_ai_floor.py
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if git diff --quiet -- pyproject.toml; then
            echo "The floor is already the newest release."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.floor.outputs.changed == 'true'
        with:
          name: release-floor
          path: pyproject.toml
          if-no-files-found: error
          retention-days: 1

  push-floor:
    needs: floor
    if: needs.floor.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # App token so the floor commit re-triggers the PR's checks (guard + build).
      # A commit pushed with the default GITHUB_TOKEN would not trigger them.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      # The commit the floor job read: if the branch has moved since, the push
      # below is rejected rather than overwriting it, and the next run retries.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.floor.outputs.sha }}
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-floor
          path: ${{ runner.temp }}/release-floor

      # Copy only the named file; nothing else from the artifact reaches the
      # checkout.
      - name: Commit and push the floor
        run: |
          cp "$RUNNER_TEMP/release-floor/pyproject.toml" .
          git config user.name "meridian-release-bot[bot]"
          git config user.email "meridian-release-bot[bot]@users.noreply.github.com"
          git add pyproject.toml
          git commit -m "chore: raise the inspect_ai floor to the release it was tested against"
          git push origin "HEAD:refs/heads/$RELEASE_BRANCH"

