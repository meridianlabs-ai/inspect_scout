name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  release-please:
    # Forks with Actions enabled would otherwise run Release Please on every
    # push to their main.
    if: github.repository == 'meridianlabs-ai/inspect_scout'
    # The reusable workflow's job requests these, so the caller must grant
    # them; Release Please itself runs with the App token.
    permissions:
      contents: write # requested by the reusable workflow
      pull-requests: write # requested by the reusable workflow
    # At this commit the reusable matches v1, except that its actions are pinned.
    uses: meridianlabs-ai/actions/.github/workflows/release-please-python.yml@bb46f82b7b1980c1a7957506d71bebbc4e31da84 # main, 2026-10-14
    with:
      # Both publishes (PyPI + the npm viewer lib) run in separate `on: release`
      # workflows, each with its own environment gate — so each posts its own
      # approval ping from there (deep-linking to the paused run), not here.
      approval-ping: false
    # Only the secrets the reusable workflow uses, not `secrets: inherit`: the
    # rest of this repo's secrets stay out of an external workflow. Its
    # optional SLACK_APPROVALS_WEBHOOK_URL is used only when approval-ping is
    # true, so it is not passed.
    secrets:
      RELEASE_PLEASE_APP_ID: ${{ secrets.RELEASE_PLEASE_APP_ID }}
      RELEASE_PLEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
