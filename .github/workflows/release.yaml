name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release-please:
    permissions:
      contents: write
      pull-requests: write
    uses: meridianlabs-ai/actions/.github/workflows/release-please-python.yml@v1
    with:
      # Both publishes (PyPI + the npm viewer lib) run in separate `on: release`
      # workflows, each with its own environment gate — so each posts its own
      # approval ping from there (deep-linking to the paused run), not here.
      approval-ping: false
    # Only the secrets the reusable workflow uses, not `secrets: inherit`: the
    # rest of this repo's secrets stay out of an external workflow. Its
    # optional SLACK_APPROVALS_WEBHOOK_URL is used only when approval-ping is
    # true, so it is not passed.
    secrets:
      RELEASE_PLEASE_APP_ID: ${{ secrets.RELEASE_PLEASE_APP_ID }}
      RELEASE_PLEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
