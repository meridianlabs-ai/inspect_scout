# TEMPORARY (PR #666 only): runs the exact steps of publish.yaml and
# npm-publish.yml on the bumped action versions, minus the real publish steps,
# environments, secrets and OIDC. npm takes the prerelease path so the
# dry-run gets a version not already on the registry. Removed before merge.
name: Verify release steps (temporary)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  publish-yaml-steps:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        lfs: true
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: 3.x
    - name: Show current version
      run: 'echo "Version: $(git describe --tags --always)"

        '
    - name: Build
      run: 'pip install --upgrade pip build

        python -m build

        ls -la dist/

        '
  npm-publish-yml-steps:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/inspect_scout/_view/ts-mono/apps/scout
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: true
    - name: Set up pnpm
      uses: pnpm/action-setup@v6
      with:
        package_json_file: src/inspect_scout/_view/ts-mono/package.json
    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 22.x
        registry-url: https://registry.npmjs.org
        cache: pnpm
        cache-dependency-path: src/inspect_scout/_view/ts-mono/pnpm-lock.yaml
    - name: Upgrade npm (for Trusted Publishing)
      run: '# Install via prefix to avoid npm self-upgrade rebuild bug on Node 22.

        npm install --prefix "$RUNNER_TEMP/npm-upgrade" --no-audit --no-fund npm@^11.5.1

        echo "$RUNNER_TEMP/npm-upgrade/node_modules/.bin" >> "$GITHUB_PATH"

        "$RUNNER_TEMP/npm-upgrade/node_modules/.bin/npm" --version

        '
    - name: Install dependencies
      working-directory: src/inspect_scout/_view/ts-mono
      run: pnpm install --frozen-lockfile
    - name: Prepare package for publishing
      run: 'npm pkg set name="@meridianlabs/inspect-scout-viewer"

        npm pkg delete private

        # Version tags live on the parent repo; the submodule has none.

        VERSION=$(git -C ${{ github.workspace }} describe --tags --abbrev=0 --match=''[0-9]*.[0-9]*.[0-9]*'')

        npm version "$VERSION" --no-git-tag-version

        '
    - name: Bump to prerelease version
      run: 'CURRENT_VERSION=$(node -p "require(''./package.json'').version")

        TIMESTAMP=$(date +%s)

        npm version patch --no-git-tag-version

        NEW_VERSION=$(node -p "require(''./package.json'').version")

        npm version "${NEW_VERSION}-beta.${TIMESTAMP}" --no-git-tag-version

        '
    - name: Run quality checks
      working-directory: src/inspect_scout/_view/ts-mono
      run: pnpm check
    - name: Build library for prerelease
      run: pnpm build:lib
    - name: Publish to NPM (dry-run)
      run: npm publish --dry-run --access public --tag beta --ignore-scripts
